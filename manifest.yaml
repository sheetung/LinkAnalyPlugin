apiVersion: v1
kind: Plugin
metadata:
  author: sheetung
  name: LinkAnaly
  repository: 'https://github.com/sheetung/LinkAnalyPlugin'
  version: 1.6.7
  description:
    en_US: Parses links in chats and sends screenshots for unparsed websites
    zh_Hans: 对聊天中的链接进行解析,以及针对未解析网站截图发送
  label:
    en_US: LinkAnaly
    zh_Hans: 链接解析
  icon: assets/favicon.ico
spec:
  config:
    - name: block_reply_link_parse
      type: boolean
      label:
        en_US: 'Block link parsing in reply messages'
        zh_Hans: '拦截回复消息中的链接解析'
      description:
        en_US: 'When enabled, skip link parsing for reply/quote messages to avoid duplicate parsing'
        zh_Hans: '开启后，当消息是回复/引用消息时，跳过链接解析，避免重复触发'
      required: false
      default: true
    - name: enable_github_gitee
      type: boolean
      label:
        en_US: 'Enable github/gitee feature'
        zh_Hans: '是否启用github/gitee解析'
      required: false
      default: true
    - name: enable_bilibili
      type: boolean
      label:
        en_US: 'Enable bilibili feature'
        zh_Hans: '是否启用bilibili解析'
      required: false
      default: true
    - name: enable_douyin
      type: boolean
      label:
        en_US: 'Enable douyin feature'
        zh_Hans: '是否启用抖音解析'
      required: false
      default: true
    - name: enable_acfun
      type: boolean
      label:
        en_US: 'Enable acfun feature'
        zh_Hans: '是否启用acfun解析'
      required: false
      default: true
    # - name: enable_weibo
    #   type: boolean
    #   label:
    #     en_US: 'Enable weibo feature'
    #     zh_Hans: '是否启用微博解析'
    #   required: false
    #   default: true
    # - name: enable_nga
    #   type: boolean
    #   label:
    #     en_US: 'Enable nga feature'
    #     zh_Hans: '是否启用nga解析'
    #   required: false
    #   default: true
    # - name: enable_xhs
    #   type: boolean
    #   label:
    #     en_US: 'Enable xhs feature'
    #     zh_Hans: '是否启用小红书解析'
    #   required: false
    #   default: true
    - name: screenshotsnap
      type: boolean
      label:
        en_US: 'Enable web screenshot feature'
        zh_Hans: '是否启用web截图功能'
      required: false
      default: true
    - name: enable_youtube
      type: boolean
      label:
        en_US: 'Enable youtube feature'
        zh_Hans: '是否启用youtube解析'
      required: false
      default: false
    - name: youtube_key
      type: string
      label:
        en_US: 'YouTube API Key'
        zh_Hans: 'YouTube API Key'
      description:
        en_US: 'Please follow https://developers.google.com/youtube/v3/getting-started to get your key.'
        zh_Hans: '请参照https://developers.google.com/youtube/v3/getting-started获取密钥'
      required: false
      default: ""
    - name: youtube_proxy
      type: string
      label:
        en_US: 'YouTube HTTP Proxy'
        zh_Hans: 'YouTube HTTP代理'
      description:
        en_US: 'HTTP proxy for YouTube API requests (format: http://host:port)'
        zh_Hans: 'YouTube API请求的HTTP代理（格式：http://host:port）'
      required: false
      default: "http://127.0.0.1:7890"
  components:
    EventListener:
      fromDirs:
      - path: components/event_listener/
execution:
  python:
    path: main.py
    attr: LinkAnaly
